name: attendance_frontend
description: "A real-time attendance Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.5+1
  # Env
  flutter_dotenv: ^5.2.1
  # Local storage
  shared_preferences: ^2.5.3
  # Offline database
  sqflite: ^2.4.2
  path: ^1.9.1
  # UI/Utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
